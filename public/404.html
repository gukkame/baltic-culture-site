<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Baltic Folk Culture</title>
    <!--
      GitHub Pages serves this file for any unmatched path (it has no
      server-side rewrite support at all, unlike Netlify/Vercel/Cloudflare).
      This is the standard "spa-github-pages" trick: encode the real path
      into a query string and redirect to index.html, which decodes it back
      via the matching script in index.html before the app boots.
      pathSegmentsToKeep assumes a root deploy (custom domain or user/org
      Pages) -- set it to 1 if this deploys to a GitHub Pages *project* page
      served under /<repo-name>/.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
