<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore the folk dances, songs, and traditions of Latvia and Lithuania side by side."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Home page only: start fetching the hero art and map texture now, instead of
      // waiting for the JS bundle to mount the components that reference them.
      if (location.pathname === '/') {
        var head = document.head
        ;[
          ['/artwork/baltic-table-painted-v1.avif', 'image/avif', 'high'],
          ['/artwork/painted-land-v1.webp', 'image/webp', 'auto'],
        ].forEach(function (a) {
          var l = document.createElement('link')
          l.rel = 'preload'
          l.as = 'image'
          l.href = a[0]
          l.type = a[1]
          l.setAttribute('fetchpriority', a[2])
          head.appendChild(l)
        })
      }
    </script>
    <title>Baltic Folk Culture | Latvia &amp; Lithuania</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
