<!doctype html>
<html lang="lv">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon-lv.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Iepazīsti Latvijas un Lietuvas tautas dejas, dziesmas un tradīcijas." />
		<script>
			// Home page only: start fetching the hero art and map texture now, instead of
			// waiting for the JS bundle to mount the components that reference them.
			if (location.pathname === "%BASE_URL%") {
				var head = document.head;
				[
					["%BASE_URL%artwork/folk-dancers-table-painted-v4.webp", "high"],
					["%BASE_URL%artwork/painted-land-v1.webp", "auto"],
					["%BASE_URL%artwork/painted-latvia-forest-v2.webp", "auto"],
				].forEach(function (a) {
					var l = document.createElement("link");
					l.rel = "preload";
					l.as = "image";
					l.href = a[0];
					l.setAttribute("fetchpriority", a[1]);
					head.appendChild(l);
				});
			}
		</script>
		<title>Baltijas Tautas Mantojums</title>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
