<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-lv.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Iepazīsti Latvijas un Lietuvas tautas dejas, dziesmas un tradīcijas." />
    <script>
      // Home page: preload the hero art before the JS bundle has loaded.
      if (location.pathname === '%BASE_URL%') {
        ;[
          ['%BASE_URL%images/home/folk-group-cabin.webp', 'high'],
          ['%BASE_URL%artwork/painted-land-v1.webp', 'auto'],
          ['%BASE_URL%artwork/painted-latvia-forest-v2.webp', 'auto'],
        ].forEach(function (image) {
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.href = image[0]
          link.setAttribute('fetchpriority', image[1])
          document.head.appendChild(link)
        })
      }
    </script>
    <title>Baltijas Tautas Mantojums</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
